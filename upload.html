<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload</title>

  <!-- Favicon -->
  <link rel="icon" href="Assets/fish-photobooth/favicon.png" type="image/x-icon" />

  <!-- Shared CSS -->
  <link rel="stylesheet" href="StyleSheets/camera.css" />
</head>

<body>

  <div class="page-background">

    <!-- Upload Screen -->
    <div class="screen" id="uploadScreen">

      <div class="photobooth-container" id="booth">

        <!-- Bubble Animation -->
        <div class="bubble-container"></div>

        <!-- Canvas -->
        <canvas id="finalCanvas" width="1176" height="1470"></canvas>

        <!-- Hidden File Input -->
        <input
          type="file"
          id="uploadPhotoInput"
          accept="image/*"
        />

        <!-- Frame Overlay -->
        <img
          class="frame-overlay"
          src="Assets/fish-photobooth/camerapage/frame.png"
          alt="Frame Overlay"
        />

      </div>

      <!-- Buttons -->
      <div class="controls">
        <button id="uploadPhoto">Upload Photo</button>
        <button id="readyButton" disabled style="display:none;">
          Ready
        </button>
      </div>

    </div>

  </div>

  <script src="Javascripts/upload.js"></script>
  <script src="Javascripts/bubbles.js"></script>

</body>
</html>
