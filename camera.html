<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Camera</title>
  <link rel="icon" href="Assets/fish-photobooth/favicon.png" type="image/x-icon" />
  <link rel="stylesheet" href="StyleSheets/camera.css" />
</head>
<body>
  <div class="page-background">

    <div class="top-bar">
      <button class="main-menu-btn" onclick="window.location.href='index.html'">&larr; Main Menu</button>
    </div>

    <!-- ===== SCREEN 1: LIVE CAMERA ===== -->
    <div class="screen" id="cameraScreen">
      <div class="photobooth-container" id="booth">
        <div class="bubble-container"></div>
        <div class="countdown-timer">3</div>

        <div class="capture-status" id="captureStatus">Photo 1 of 2</div>

        <button class="pose-ideas-btn" id="poseIdeasBtn">Pose Ideas</button>

        <!-- finalCanvas cuma buffer, disembunyiin lewat CSS -->
        <canvas id="finalCanvas" width="1176" height="1470"></canvas>
        <video id="liveVideo" autoplay playsinline muted></video>

        <div class="pose-sidebar" id="poseSidebar">
          <div class="pose-sidebar-header">
            <button class="pose-back-btn" id="poseBackBtn">&larr;</button>
            <span class="pose-sidebar-title">Pose Ideas</span>
          </div>
          <div class="pose-columns" id="poseColumns"></div>
          <div class="pose-sidebar-footer">
            <span class="pose-set-label" id="poseSetLabel"></span>
            <button class="pose-next-btn" id="poseNextBtn">Next &rarr;</button>
          </div>
        </div>
      </div>

      <div class="controls">
        <button id="takePhoto">Capture</button>
      </div>
    </div>

    <!-- ===== SCREEN 2: PREVIEW FOTO (UTUH) ===== -->
    <div class="screen" id="previewScreen" style="display:none;">
      <div class="photobooth-container">
        <canvas id="previewCanvas"></canvas>
      </div>

      <div class="controls">
        <button id="retakeBtn">Retake</button>
        <button id="nextBtn">Next</button>
        <button id="doneBtn">Done</button>
      </div>
    </div>

    <!-- ===== SCREEN 3: PILIH FRAME ===== -->
    <div class="screen" id="frameScreen" style="display:none;">
      <div class="frame-preview-container">
        <canvas id="stripPreviewCanvas"></canvas>
        <img class="frame-overlay" id="frameOverlayImg" alt="frame preview">
      </div>
      <div class="frame-selector" id="frameSelector"></div>
      <div class="controls">
        <button id="saveBtn">Save</button>
        <button id="confirmFrameBtn">Confirm</button>
      </div>
    </div>

  </div>

  <script src="Javascripts/camera.js"></script>
  <script src="Javascripts/bubbles.js"></script>
</body>
</html>
